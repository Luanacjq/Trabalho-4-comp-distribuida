services:
  api:
    image: linkextractor-api:ruby
    build: ./api
    ports:
      - "4567:4567"
    environment:
      - REDIS_URL=redis://redis:6379
      - USE_CACHE=${USE_CACHE:-true}
  web:
    image: linkextractor-web:php
    build: ../web
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - API_ENDPOINT=http://api:4567/api/
  redis:
    image: redis
